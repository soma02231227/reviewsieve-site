<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ReviewSieve Billing</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #f6f8fa;
      color: #1f2328;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 560px;
      margin-top: 10vh;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .eyebrow {
      margin-bottom: 8px;
      color: #57606a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: #57606a;
      font-size: 15px;
      line-height: 1.65;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .status.success {
      color: #1a7f37;
      background: #dafbe1;
    }

    .status.cancel {
      color: #9a6700;
      background: #fff8c5;
    }

    .status.portal {
      color: #8250df;
      background: #fbefff;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .button {
      display: inline-block;
      padding: 10px 16px;
      color: #ffffff;
      background: #1f883d;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .button:hover {
      background: #1a7f37;
    }

    .secondary {
      color: #1f2328;
      background: #ffffff;
      border: 1px solid #d0d7de;
    }

    .secondary:hover {
      background: #f6f8fa;
    }

    .note {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #d8dee4;
      color: #6e7781;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="eyebrow">REVIEWSIEVE</div>

    <div id="status" class="status success">
      <span class="dot"></span>
      <span id="statusText">Payment complete</span>
    </div>

    <h1 id="title">Payment received</h1>

    <p id="message">
      Your payment was accepted. Return to ReviewSieve Account and refresh
      your entitlement. It can take a few seconds for Pro access to update.
    </p>

    <div class="actions">
      <a
        class="button"
        href="https://soma02231227.github.io/reviewsieve-site/"
      >
        ReviewSieve website
      </a>

      <a
        class="button secondary"
        href="javascript:window.close()"
      >
        Close this tab
      </a>
    </div>

    <div class="note">
      You can safely close this page and return to the ReviewSieve extension.
    </div>
  </main>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const result = params.get("result");

      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const title = document.getElementById("title");
      const message = document.getElementById("message");

      if (result === "cancel") {
        document.title = "Checkout canceled · ReviewSieve";

        status.className = "status cancel";
        statusText.textContent = "Checkout canceled";
        title.textContent = "Checkout canceled";
        message.textContent =
          "No payment was made. You can close this page and return to ReviewSieve.";
        return;
      }

      if (result === "portal") {
        document.title = "Billing updated · ReviewSieve";

        status.className = "status portal";
        statusText.textContent = "Billing updated";
        title.textContent = "Billing updated";
        message.textContent =
          "Return to ReviewSieve Account and refresh your entitlement if you changed your subscription.";
        return;
      }

      document.title = "Payment received · ReviewSieve";

      status.className = "status success";
      statusText.textContent = "Payment complete";
      title.textContent = "Payment received";
      message.textContent =
        "Your payment was accepted. Return to ReviewSieve Account and refresh your entitlement. It can take a few seconds for Pro access to update.";
    })();
  </script>
</body>
</html>
