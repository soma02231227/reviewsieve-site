<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReviewSieve</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ff; color: #111827; }
    main { width: min(760px, calc(100% - 40px)); background: white; border: 1px solid #ddd6fe; border-radius: 28px; padding: 44px; box-shadow: 0 24px 80px rgba(76,29,149,.12); }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #6b7280; }
    h1 { margin: 8px 0 12px; font-size: 42px; }
    p { color: #4b5563; line-height: 1.7; }
    .pill { display: inline-block; margin-top: 10px; padding: 10px 14px; background: #ede9fe; border-radius: 999px; color: #5b21b6; font-weight: 700; }
    nav { margin-top: 28px; display: flex; gap: 16px; flex-wrap: wrap; }
    a { color: #6d28d9; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">REVIEWSIEVE</div>
  <h1>Less review noise. More signal.</h1>
  <p>ReviewSieve is a Chrome extension for GitHub pull requests. It filters AI/bot review noise, collapses duplicates, and helps developers focus on what changed since the last visit.</p>
  <span class="pill">Raw GitHub review text stays in your browser.</span>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
  </nav>
</main>
</body>
</html>
